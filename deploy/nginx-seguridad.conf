# Cabeceras de seguridad del Sistema Contable.
# Instalar en /etc/nginx/snippets/contable-seguridad.conf.
# Se incluye en el server y en cada location que define su propio add_header,
# porque nginx no hereda add_header en un location que declara otro.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Solo recursos del propio dominio. 'unsafe-inline' en estilos es necesario porque
# Angular inyecta los estilos de los componentes; los scripts inline siguen prohibidos.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
