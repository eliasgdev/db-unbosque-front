# Sistema Contable — VM-Front (vm-web)
# Instalar en /etc/nginx/sites-available/contable y enlazar en sites-enabled.
# Sirve el build de Angular y reenvía /api/ a la API FastAPI en VM-Back.

upstream api_contable {
    # PENDIENTE: reemplazar por la IP privada de VM-Back: server <ip-privada-vm-back>:8000;
    server 127.0.0.1:8000;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # default_server + "_": atiende cualquier nombre con el que se llegue a la VM.
    server_name _;

    root /var/www/contable;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;

    include snippets/contable-seguridad.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Archivos ocultos (.git, .env...) nunca se sirven.
    location ~ /\. {
        deny all;
    }

    # Rutas del SPA (/plan-cuentas, /asientos...): si no existe el archivo, se entrega index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html sin caché para que cada despliegue se vea de inmediato.
    location = /index.html {
        include snippets/contable-seguridad.conf;
        add_header Cache-Control "no-cache";
    }

    # Los .js y .css llevan un hash en el nombre: se cachean por un año.
    location ~* \.(js|css|ico)$ {
        include snippets/contable-seguridad.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Proxy inverso hacia la API: el navegador solo habla con este servidor.
    location /api/ {
        proxy_pass http://api_contable;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
