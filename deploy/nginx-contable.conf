# Sistema Contable — VM-Front (vm-web)
# Sirve el build de Angular y reenvía /api/ a la API FastAPI en VM-Back.

upstream api_contable {
    # PENDIENTE: reemplazar por la IP privada de VM-Back, ej. server 10.0.1.5:8000;
    server 127.0.0.1:8000;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name contable-web.westus3.cloudapp.azure.com 172.182.213.222;

    root /var/www/contable;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Rutas del SPA (/plan-cuentas, /asientos...): si no existe el archivo, se entrega index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html no se guarda en caché para que cada despliegue se vea de inmediato.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Los .js y .css llevan un hash en el nombre: se pueden cachear mucho tiempo.
    location ~* \.(js|css|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy inverso hacia la API: el navegador solo habla con este servidor.
    location /api/ {
        proxy_pass http://api_contable;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
